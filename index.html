<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camille Ogilvie</title>

  <link rel="icon" href="assets/clo-logo.svg" type="image/svg+xml">

  <style>
    :root {
      /* From Figma "home page" (1:2): logo node is 164 x 77.176.
         The exported SVG is 171.235 x 84.412 — the extra is the stroke
         bleeding symmetrically past the node bounds. */
      --logo-width: 171.235px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      display: block;
      width: var(--logo-width);
      height: auto;
      max-width: calc(100vw - 2rem);
    }
  </style>
</head>
<body>
  <img class="logo" src="assets/clo-logo.svg" alt="CLO" width="171" height="84">
</body>
</html>
